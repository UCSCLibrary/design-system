<style type="text/css">
  @import url("https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap");

  :root {
    --contact-card-width: 14.5rem;
    --contact-card-border-color: #a6a6a6;
    --contact-card-link-color: #004f7c;
    --contact-card-text-color: #000;
  }

  .contact-card {
    box-sizing: border-box;
    width: min(100%, var(--contact-card-width));
    padding: 1.25rem 1rem;
    border: 1px solid var(--contact-card-border-color);
    border-radius: 0.2rem;
    color: var(--contact-card-text-color);
    background: #fff;
    font-family: "Open Sans", Arial, sans-serif;
    font-size: 0.75rem;
    line-height: 1.25;
  }

  .contact-card__title {
    margin: 0 0 1.25rem;
    font-size: 0.875rem;
    font-weight: 700;
    line-height: 1.2;
  }

  .contact-card a {
    color: var(--contact-card-link-color);
    text-decoration: underline;
  }

  .contact-card__item {
    display: grid;
    grid-template-columns: 0.875rem 1fr;
    gap: 0.375rem;
    align-items: start;
    margin: 0 0 1.125rem;
  }

  .contact-card__item:last-child {
    margin-bottom: 0;
  }

  .contact-card__icon {
    width: 0.875rem;
    height: 0.875rem;
    margin-top: 0.05rem;
    fill: currentColor;
  }

  .contact-card__label,
  .contact-card__value {
    display: block;
  }
</style>

<article class="contact-card">
  <h2 class="contact-card__title"><a href="">Title</a></h2>

  <div class="contact-card__item">
    <svg class="contact-card__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2 5h20v14H2V5Zm10 8L3.8 6.5h16.4L12 13Zm-3.2-.1L3.5 8.7v8.1l5.3-3.9Zm6.4 0 5.3 3.9V8.7l-5.3 4.2Zm-1.3 1L12 15.4l-1.9-1.5-3.6 2.8h11l-3.6-2.8Z" />
    </svg>
    <a href="mailto:example@ucsc.edu">example@ucsc.edu</a>
  </div>

  <div class="contact-card__item">
    <svg class="contact-card__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m6.6 10.8 2.8-1.2-2-4.8-3.1 1.3c-.8.3-1.2 1.2-1 2 1.7 6.3 6.6 11.2 12.9 12.9.8.2 1.7-.2 2-1l1.3-3.1-4.8-2-1.2 2.8a15.1 15.1 0 0 1-6.9-6.9Z" />
    </svg>
    <div>
      <span class="contact-card__label">Location:</span>
      <span class="contact-card__value">XXX-XXX-XXXX</span>
    </div>
  </div>

  <div class="contact-card__item">
    <svg class="contact-card__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="m6.6 10.8 2.8-1.2-2-4.8-3.1 1.3c-.8.3-1.2 1.2-1 2 1.7 6.3 6.6 11.2 12.9 12.9.8.2 1.7-.2 2-1l1.3-3.1-4.8-2-1.2 2.8a15.1 15.1 0 0 1-6.9-6.9Z" />
    </svg>
    <div>
      <span class="contact-card__label">Location:</span>
      <span class="contact-card__value">XXX-XXX-XXXX</span>
    </div>
  </div>
</article>
